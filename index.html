<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CallCue</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand">
        <img src="assets/icon.png" alt="" class="brand-mark" width="18" height="18" />
        <span class="brand-name">CallCue</span>
      </div>
      <div class="status-pill" id="status-pill" data-state="idle">
        <span class="dot"></span><span id="status-text">Ready</span><span id="timer" class="timer"></span>
      </div>
      <button class="icon-btn pin-btn" id="pin-btn" type="button" title="Keep window on top" aria-pressed="false"></button>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" class="tab active" data-view="live" aria-selected="true">Live</button>
      <button role="tab" class="tab" data-view="context" aria-selected="false">Context</button>
      <button role="tab" class="tab" data-view="history" aria-selected="false">History</button>
      <button role="tab" class="tab" data-view="settings" aria-selected="false">Settings</button>
    </nav>

    <main>
      <section id="view-live" class="view active" role="tabpanel">
        <div class="card controls">
          <div class="controls-row">
            <label class="select-wrap" title="Call type">
              <span class="sr-only">Call type</span>
              <select id="live-mode">
                <option value="interview">Interview</option>
                <option value="sales">Sales call</option>
                <option value="meeting">Meeting</option>
                <option value="general">Other call</option>
              </select>
            </label>
            <button id="start-btn" class="btn btn-primary btn-start" type="button"></button>
          </div>
          <div class="controls-row meters-row">
            <div class="meter" id="meter-them" title="The other side (your computer's audio)">
              <span class="meter-label" id="meter-them-label">Them</span>
              <span class="meter-bar"><i></i></span>
            </div>
            <div class="meter" id="meter-you" title="You (microphone)">
              <span class="meter-label" id="meter-you-label">You</span>
              <span class="meter-bar"><i></i></span>
            </div>
            <label class="switch" title="Suggest answers automatically when a question is asked">
              <input type="checkbox" id="auto-toggle" />
              <span class="switch-track"></span>
              <span class="switch-label">Auto-answer</span>
            </label>
          </div>
        </div>

        <div class="card answer-card" id="answer-card">
          <div class="answer-head">
            <span class="answer-kicker" id="answer-kicker">Suggested answer</span>
            <span class="answer-nav">
              <button class="icon-btn" id="ans-prev" type="button" title="Previous answer" aria-label="Previous answer"></button>
              <span id="ans-pos" class="ans-pos"></span>
              <button class="icon-btn" id="ans-next" type="button" title="Next answer" aria-label="Next answer"></button>
            </span>
            <span class="answer-actions">
              <button class="icon-btn" id="ans-stop" type="button" title="Stop" aria-label="Stop answer"></button>
              <button class="icon-btn" id="ans-regen" type="button" title="Answer again" aria-label="Answer again"></button>
              <button class="icon-btn" id="ans-copy" type="button" title="Copy" aria-label="Copy answer"></button>
            </span>
          </div>
          <div class="answer-question" id="answer-question"></div>
          <div class="answer-scroll">
            <div class="answer-body" id="answer-body"></div>
            <div class="answer-empty" id="answer-empty"></div>
          </div>
        </div>

        <div class="card transcript-card">
          <div class="transcript-head">
            <span class="section-label">Transcript</span>
            <button id="answer-now" class="btn btn-small" type="button" title="Answer the last question now (Ctrl+Shift+Enter)"></button>
          </div>
          <div class="transcript" id="transcript" aria-live="polite"></div>
        </div>

        <form class="ask" id="ask-form" autocomplete="off">
          <input id="ask-input" type="text" placeholder="Type a question and press Enter" aria-label="Type a question" />
          <button type="submit" class="btn btn-icon" id="ask-btn" title="Get an answer" aria-label="Get an answer"></button>
        </form>
      </section>

      <section id="view-context" class="view" role="tabpanel"></section>
      <section id="view-history" class="view" role="tabpanel"></section>
      <section id="view-settings" class="view" role="tabpanel"></section>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
